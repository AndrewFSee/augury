[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "augury"
version = "0.2.0"
description = "Probabilistic forecasting of financial returns: price bands, VaR and tail risk, judged out of sample"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Andrew See" }]
keywords = ["quantitative finance", "probabilistic forecasting", "garch", "value at risk", "monte carlo", "volatility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "polars>=0.19",
    "pyarrow>=14",  # Parquet engine used by augury.data.storage
    "arch>=6.0",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
bayesian = ["pymc>=5.0", "arviz>=0.16", "numpyro>=0.13"]
gpu = ["jax[cuda12_pip]>=0.4", "cupy-cuda12x>=12.0"]
api = ["fastapi>=0.104", "uvicorn[standard]>=0.24", "websockets>=12.0"]
dashboard = ["streamlit>=1.28", "plotly>=5.17"]
data = ["yfinance>=0.2", "requests>=2.31"]
plot = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.6",
    "pre-commit>=3.5",
    "pandas-stubs>=2.0",
    "types-requests>=2.31",
    "httpx>=0.27",  # required by starlette/fastapi TestClient
]
all = [
    "augury[bayesian]",
    "augury[api]",
    "augury[dashboard]",
    "augury[data]",
    "augury[plot]",
]

[project.urls]
Homepage = "https://github.com/AndrewFSee/augury"
Repository = "https://github.com/AndrewFSee/augury"
Documentation = "https://github.com/AndrewFSee/augury/tree/main/docs"
"Bug Tracker" = "https://github.com/AndrewFSee/augury/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "SIM"]
ignore = [
    "ANN401",
    # Quantitative finance uses single-letter uppercase names by convention
    # e.g. S0 (spot price), K (strike), T (maturity), H (Hurst), Z (standard normal)
    "N803",
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# Scripts set up sys.path / warning filters before imports and print wide tables.
"examples/*" = ["ANN", "T201", "E402", "E501"]
"scripts/*" = ["ANN", "T201", "E402", "E501"]
"dashboard/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "augury.data.features"
disable_error_code = ["return-value", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=augury --cov-report=term-missing --cov-report=xml -v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
]

[tool.coverage.run]
source = ["augury"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError", "if TYPE_CHECKING:"]
